name: Build and release

# Push a tag such as v2.0.0 to build a Windows .exe and a macOS .app and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0
      - run: python -m unittest discover -s tests
        env: { QT_QPA_PLATFORM: offscreen, SDL_AUDIODRIVER: dummy }

  build:
    needs: tests
    strategy:
      matrix:
        include:
          - { os: windows-latest, name: My-Woofie-windows, path: dist/My-Woofie }
          - { os: macos-latest, name: My-Woofie-macos, path: dist/My-Woofie.app }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - if: matrix.os == 'macos-latest'
        run: pip install pyobjc-framework-Quartz
      - run: python packaging/build.py
        env: { QT_QPA_PLATFORM: offscreen, SDL_AUDIODRIVER: dummy }
      - name: Zip (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path dist/My-Woofie -DestinationPath ${{ matrix.name }}.zip
      - name: Zip (macOS)
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent dist/My-Woofie.app ${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "${{ matrix.name }}.zip" }
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "${{ matrix.name }}.zip" }
